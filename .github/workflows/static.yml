# Simple workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Runner engine ko warning trigger karne se rokne ke liye
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node20

# GitHub Pages deployment permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrent deployments ko manage karne ke liye
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Ubuntu 26 migration notice hatane ke liye fixed LTS image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
